<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿原 · 延迟消息</title>
  <link rel="stylesheet" href="../series/series.css">
  <link rel="stylesheet" href="chapter4.css">
  <script src="../series/series.js" defer></script>
  <style>
    body{background:#071016;color:#dce8ed;display:grid;min-height:100vh;place-items:center;padding:16px;}
    .message-window{width:min(720px,100%);border:1px solid #29404c;border-radius:16px;background:#0e1a22;box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden;}
    .message-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #29404c;}
    .message-head strong{display:block}.message-head small{color:#8fa2ad}.pulse{width:10px;height:10px;border-radius:50%;background:#4ad2bf;box-shadow:0 0 12px #4ad2bf;}
    .feed{min-height:430px;max-height:66vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .msg{max-width:88%;border-radius:12px 12px 12px 3px;padding:11px 14px;background:#13232d;line-height:1.65;animation:rise .35s both;}
    .msg.sys{align-self:center;background:transparent;color:#8fa2ad;font-size:.8rem;text-align:center;}
    .msg.link{border:1px solid #4ad2bf;background:transparent}.msg.link a{color:#75e4d4;text-decoration:none;font-weight:700;}
    .typing{display:flex;gap:5px;width:56px}.typing i{width:6px;height:6px;border-radius:50%;background:#8fa2ad;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    .message-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #29404c;padding:12px 16px;color:#8fa2ad;font-size:.78rem;}
    .message-foot button{border:0;background:transparent;color:#75e4d4;cursor:pointer;}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes blink{50%{opacity:.2}}
  </style>
</head>
<body data-chapter="4" data-objective="核验鹿原记忆健康试点的自愿者名单">
  <main class="message-window">
    <header class="message-head">
      <span class="pulse" aria-hidden="true"></span>
      <div><h1 style="font-size:1rem;margin:0">林知秋 · 延迟投递</h1><small>来源：海宁中央调制站离线队列</small></div>
    </header>
    <section class="feed" id="feed" aria-live="polite"></section>
    <footer class="message-foot">
      <span>消息在离线队列中等待了 19 天。</span>
      <button id="reveal-all" type="button">立即显示全部</button>
    </footer>
    <noscript><p style="padding:0 16px 16px"><a href="portal.html">直接打开便民服务平台 →</a></p></noscript>
  </main>
  <script>
    const feed=document.getElementById("feed");
    const reveal=document.getElementById("reveal-all");
    const messages=[
      {t:"sys",x:"— 延迟消息校验通过 · 声纹来源 L-0001 —"},
      {t:"in",x:"如果你已经到了这里，说明海宁那台机器还没来得及把我全部变成它的声音。"},
      {t:"in",x:"他们会把你引向鹿原。别躲。鹿原是第一座真正把这套技术交给城市管理者的地方。"},
      {t:"in",x:"那里正在推一个叫「记忆健康」的便民试点。宣传说，人们自愿预约，公开听证，全程可退出。"},
      {t:"in",x:"三个说法里，没有一个是真的。名单比预约系统更早出现，听证会比项目启动更晚。"},
      {t:"in",x:"先从自愿者名单开始。不要只看名字，比较街道编码、预约编号和申请时间。"},
      {t:"in",x:"如果你能证明他们没有自愿，就能找到补造审批的那一批档案。那里面有我现在的位置。"},
      {t:"link",x:"打开鹿原市「记忆健康」便民服务平台 →",href:"portal.html"},
      {t:"sys",x:"— 消息结束 · 后续投递条件未知 —"}
    ];
    let index=0,timer=null,typing=null,pending=null;
    function render(message){
      const node=document.createElement("div");
      node.className=`msg ${message.t==="sys"?"sys":message.t==="link"?"link":""}`;
      if(message.t==="link") node.innerHTML=`<a href="${message.href}">${message.x}</a>`;
      else node.textContent=message.x;
      feed.appendChild(node);
      feed.scrollTop=feed.scrollHeight;
    }
    function showTyping(callback,duration){
      typing=document.createElement("div");
      typing.className="msg typing";
      typing.innerHTML="<i></i><i></i><i></i>";
      feed.appendChild(typing);
      timer=setTimeout(()=>{typing?.remove();typing=null;timer=null;callback();},duration);
    }
    function next(){
      if(index>=messages.length){reveal.hidden=true;return;}
      const message=messages[index++];
      pending=message;
      if(message.t==="in"){
        showTyping(()=>{render(message);pending=null;timer=setTimeout(next,420);},Math.min(1500,500+message.x.length*20));
      }else{
        render(message);pending=null;timer=setTimeout(next,message.t==="link"?750:850);
      }
    }
    function finishConversation(){
      if(timer) clearTimeout(timer);
      timer=null;
      typing?.remove();
      typing=null;
      if(pending) render(pending);
      pending=null;
      while(index<messages.length) render(messages[index++]);
      reveal.hidden=true;
    }
    reveal.addEventListener("click",finishConversation);
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) finishConversation();
    else timer=setTimeout(next,500);
  </script>
</body>
</html>
