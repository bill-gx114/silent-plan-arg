<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>案件笔记 · 林知秋</title>
  <link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="blog.css">
</head>
<body class="paper">
  <main class="page page--decision">
    <header class="page-header"><span class="brand">CASE NOTEBOOK / ZL-0315</span><a href="blog.html">返回博客</a></header>
    <div class="section-stack">
      <section class="notebook-grid">
        <aside class="panel">
          <p class="eyebrow">剩余备忘</p>
          <div class="memo-count" id="memo-count">3</div>
          <p class="muted">备忘只补齐桥接线索，不替你完成证据判断。</p>
          <p><a href="attachments.html">博客附件</a></p>
          <p><a data-site="corporate" href="../corporate/">回声科技</a></p>
          <p><a data-site="archive" href="../archive/">档案镜像</a></p>
        </aside>
        <section class="panel">
          <h1>汇总跨站证据</h1>
          <div class="case-progress">
            <p class="eyebrow">调查进度</p>
            <p class="progress-count" id="progress-count">0 / 4</p>
            <div class="evidence-list" id="evidence-list"></div>
            <p class="next-action" id="next-action"></p>
          </div>
          <h2 class="manual-entry-title">手动补录</h2>
          <p class="muted">正常调查会自动记录证据；这里保留给旧存档和作弊码。</p>
          <form id="fragment-form" class="form-stack">
            <label class="field-group">证据片段<input id="fragment-input" placeholder="输入你在材料中发现的英文片段"></label>
            <div class="form-actions">
              <button type="submit">记录片段</button>
            </div>
          </form>
          <form id="token-form" class="form-stack">
            <label class="field-group">启动令牌<input id="token-input" placeholder="由档案镜像生成"></label>
            <div class="form-actions">
              <button type="submit">记录令牌</button>
            </div>
          </form>
          <p class="status" id="status" role="status"></p>
          <h2 id="endings-title">调查结论</h2>
          <div id="endings"></div>
        </section>
      </section>
    </div>
  </main>
  <script type="module">
    import { notebookView, submitNotebook } from "./blog.js";
    import { fragments } from "../shared/evidence.js";
    const params = new URLSearchParams(location.search);
    const status = document.querySelector("#status");
    if (params.get("fragment") || params.get("token")) {
      status.removeAttribute("data-state");
      submitNotebook(params.get("fragment"), params.get("token"));
      status.dataset.state = "success";
      status.textContent = "档案镜像证据和启动令牌已归入案件。";
    }
    const render = () => {
      const { state, evidence, nextAction, endings: available } = notebookView();
      document.querySelector("#memo-count").textContent = state.memos;
      const foundCount = evidence.filter((item) => item.found).length;
      document.querySelector("#progress-count").textContent = `${foundCount} / ${fragments.length}`;
      document.querySelector("#evidence-list").innerHTML = fragments.map((item) => {
        const found = state.fragments.includes(item.code);
        return `<div class="evidence-item ${found ? "is-found" : ""}">
          <span aria-hidden="true">${found ? "✓" : "○"}</span>
          <span><b>${item.label}</b><small>${item.source}</small></span>
          <span class="fragment-chip">${found ? item.code : "未发现"}</span>
        </div>`;
      }).join("");
      document.querySelector("#next-action").innerHTML =
        `<b>建议下一步：</b><a href="${nextAction.href}">${nextAction.label} →</a>`;
      document.querySelector("#endings").innerHTML = available.length ? available.map((item) => {
        const labels = { publish: "公开证据", hold: "暂缓并保存", follow: "沿她真正的路线继续" };
        return `<a class="ending" href="dead-switch.html?ending=${item}">${labels[item]}</a>`;
      }).join("") : '<p class="muted">结论将在四项证据全部取得后开放。</p>';
    };
    document.querySelector("#fragment-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const before = notebookView().state.fragments.length;
      const input = document.querySelector("#fragment-input");
      const state = submitNotebook(input.value, "");
      status.textContent = state.fragments.length > before ? "证据片段已记录。" : "这个片段无法与现有材料对应。";
      status.dataset.state = state.fragments.length > before ? "success" : "error";
      input.value = ""; render();
    });
    document.querySelector("#token-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const state = submitNotebook("", document.querySelector("#token-input").value);
      status.textContent = state.switchToken ? "启动令牌已记录。" : "令牌为空。";
      status.dataset.state = state.switchToken ? "success" : "error";
      render();
    });
    render();
  </script>
</body>
</html>
